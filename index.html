<style>
  :root {
    --bg: #F4EFE6; --bg-2: #EDE5D6; --paper: #FBF7EE;
    --ink: #1A1714; --ink-2: #4A433B; --ink-3: #8A8275;
    --line: #1A171410; --line-2: #1A171420;
    --accent: #D4643A; --accent-soft: #D4643A22;
    --good: #5B7A3A; --warn: #B8852E; --bad: #B0432B;
    --r-sm: 10px; --r-md: 18px; --r-lg: 28px;
    --r-blob: 62% 38% 55% 45% / 50% 60% 40% 50%;
    --shadow-1: 0 1px 2px rgba(26,23,20,0.04), 0 4px 12px rgba(26,23,20,0.04);
    --shadow-2: 0 8px 32px rgba(26,23,20,0.08);
    --pad: 24px;
  }
  [data-theme="dark"] {
    --bg: #131110; --bg-2: #1B1816; --paper: #1F1B19;
    --ink: #F0E6D3; --ink-2: #C7BDA9; --ink-3: #A8A098;
    --line: #F0E6D310; --line-2: #F0E6D320; --accent-soft: #D4643A33;
  }
  [data-density="compact"] { --pad: 16px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; height: 100vh;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font: inherit; color: inherit; }
  .bg-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-blob { position: absolute; border-radius: var(--r-blob); filter: blur(80px); opacity: 0.5; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 500; background: var(--line); color: var(--ink-2); letter-spacing: 0.02em; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 100px; background: var(--ink); color: var(--bg); font-weight: 500; font-size: 13px; transition: transform .1s, opacity .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); }
  .btn.accent { background: var(--accent); color: white; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--pad); }
  .sidebar { width: 240px; flex-shrink: 0; background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; z-index: 5; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; color: var(--ink-2); font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  .nav-item:hover { background: var(--line); color: var(--ink); }
  .nav-item.active { background: var(--ink); color: var(--bg); }
  .main { flex: 1; height: 100vh; overflow: auto; position: relative; z-index: 1; }
  .topbar { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); padding: 16px 32px; display: flex; align-items: center; gap: 16px; z-index: 4; }
  .topbar h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .topbar .sub { color: var(--ink-3); font-size: 13px; }

  /* Sidebar Speak Up button */
  .sidebar-speak {
    margin: 8px 12px 4px; padding: 12px 14px; border-radius: 14px;
    background: var(--accent); color: white; font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(212,100,58,0.3);
    transition: transform .15s;
  }
  .sidebar-speak:hover { transform: translateY(-1px); }
  .sidebar-speak .pulse { width: 8px; height: 8px; border-radius: 50%; background: white; box-shadow: 0 0 0 0 rgba(255,255,255,0.7); animation: pulse 2s infinite; }

  /* Amoeba Agent FAB — now in primary bottom-right slot */
  .agent-fab {
    position: fixed; bottom: 28px; right: 28px; z-index: 100;
    background: var(--ink); color: var(--bg);
    border-radius: 100px; padding: 14px 22px 14px 16px;
    font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 10px 32px rgba(26,23,20,0.32), 0 2px 8px rgba(26,23,20,0.18);
    cursor: pointer; transition: transform .15s; border: none;
  }
  .agent-fab:hover { transform: translateY(-2px) scale(1.02); }
  .agent-fab .agent-blob {
    width: 24px; height: 24px;
    border-radius: 62% 38% 55% 45% / 50% 60% 40% 50%;
    background: linear-gradient(135deg, var(--accent), #B8852E);
    animation: blob 14s ease-in-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
    70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  @keyframes agent-bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-3px); opacity: 1; } }
  .agent-dot { width: 5px; height: 5px; background: var(--ink-3); border-radius: 50%; display: inline-block; animation: agent-bounce 1.2s ease-in-out infinite; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(26,23,20,0.4); backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--paper); border-radius: 24px; width: 100%; max-width: 600px; padding: 32px; box-shadow: var(--shadow-2); border: 1px solid var(--line); max-height: 90vh; overflow: auto; }

  .amoeba-stage { position: relative; width: 100%; height: 720px; overflow: hidden; border-radius: var(--r-lg); background: linear-gradient(135deg, var(--bg-2), var(--paper)); border: 1px solid var(--line); }
  [data-motion="off"] .amoeba { animation: none !important; }
  .amoeba { position: absolute; border-radius: var(--r-blob); cursor: pointer; transition: transform .3s ease, box-shadow .3s ease, opacity .3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 18px; user-select: none; animation: blob 18s ease-in-out infinite; }
  .amoeba:hover { transform: scale(1.04); box-shadow: 0 12px 40px rgba(26,23,20,0.18); }
  .amoeba.dimmed { opacity: 0.18; pointer-events: none; }
  @keyframes blob {
    0%,100% { border-radius: 62% 38% 55% 45% / 50% 60% 40% 50%; }
    25% { border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
    50% { border-radius: 55% 45% 60% 40% / 45% 55% 50% 50%; }
    75% { border-radius: 40% 60% 50% 50% / 60% 40% 55% 45%; }
  }

  .filter-seg { display: inline-flex; padding: 3px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 100px; }
  .filter-seg button { padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 500; color: var(--ink-3); transition: all .15s; }
  .filter-seg button.active { background: var(--ink); color: var(--bg); }

  .flow-rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .flow-stage { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; min-height: 480px; display: flex; flex-direction: column; }
  .flow-stage h3 { margin: 0 0 4px; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
  .flow-stage .stage-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 14px; }
  .ticket { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: grab; transition: transform .12s, box-shadow .12s; }
  .ticket:hover { transform: translateY(-1px); box-shadow: var(--shadow-1); }
  .ticket .t-title { font-weight: 500; font-size: 13px; margin-bottom: 6px; line-height: 1.35; }
  .ticket .t-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); }

  .week-cell { background: var(--paper); padding: 6px; min-height: 64px; position: relative; font-size: 11px; }
  .touch-block { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 6px 8px; font-size: 11px; font-weight: 500; color: white; line-height: 1.3; cursor: pointer; overflow: hidden; }
  .touch-block.point { background: linear-gradient(135deg, #D4643A, #B0432B); }
  .touch-block.down { background: linear-gradient(135deg, #5B7A3A, #3F5526); }
  .touch-block .t-time { font-size: 10px; opacity: 0.85; font-weight: 400; }

  .role-pill { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .role-PO { background: #D4643A22; color: #B0432B; }
  .role-TM { background: #5B7A3A22; color: #3F5526; }
  .role-CT { background: #1A171410; color: #4A433B; }
  .role-ET { background: #1A171408; color: #8A8275; }
  .role-NP { background: #B8852E22; color: #8B5E1A; }
  [data-theme="dark"] .role-PO { color: #E89870; }
  [data-theme="dark"] .role-TM { color: #97B770; }
  [data-theme="dark"] .role-CT { color: #C7BDA9; }
  [data-theme="dark"] .role-ET { color: #A8A098; }
  [data-theme="dark"] .role-NP { color: #DBB46B; }

  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .avatar.lg { width: 56px; height: 56px; font-size: 16px; }
  .avatar.sm { width: 26px; height: 26px; font-size: 10px; }

  .divider { height: 1px; background: var(--line); margin: 16px 0; border: none; }
  .kbd { display: inline-flex; padding: 1px 6px; border-radius: 4px; background: var(--line); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-2); }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fade-in .3s ease both; }

  .field { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; font-size: 13px; outline: none; transition: border-color .15s; }
  .field:focus { border-color: var(--accent); }
  textarea.field { min-height: 80px; resize: vertical; font-family: inherit; }
  .field-label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; display: block; margin: 12px 0 6px; }
</style>
